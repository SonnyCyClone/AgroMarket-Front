<!-- 
  Tarjeta de producto para AgroMarket
  
  Componente reutilizable que muestra información de producto en formato tarjeta.
  Compatible con productos API (nuevo formato) y legacy (formato anterior).
  Diseño original con manejo condicional de imágenes.
-->
<div class="product-card" (click)="onViewProduct()">
  <div class="am-card__image">
    <ng-container *ngIf="getImageUrl(); else noImage">
      <img [src]="getImageUrl()"
           alt="Imagen del producto"
           (error)="imageError = true"
           loading="lazy"
           id="product-card__img" />
    </ng-container>
    <ng-template #noImage>
      <div class="am-card__placeholder">Imagen no disponible</div>
    </ng-template>
    
    <div *ngIf="hasDiscount" class="discount-badge">
      -{{ getDiscountPercent() }}%
    </div>
    
    <!-- Botón de edición SOLO para modo administración -->
    <button 
      *ngIf="canEdit"
      [id]="'product-edit-button-' + getProductId()"
      class="edit-button"
      (click)="onEditProduct($event)"
      title="Editar producto"
      aria-label="Editar producto"
    >
      ⚙️
    </button>
  </div>
  
  <div class="product-info">
    <!-- Product Name -->
    <h3 id="product-card__name">{{ getName() }}</h3>
    
    <!-- Available Quantity (including unit) -->
    <p id="product-card__stock">Cantidad: {{ getQuantity() }} {{ getQuantity() === 1 ? 'Unidad' : 'Unidades' }}</p>
    
    <!-- Description -->
    <p id="product-card__desc">{{ getDescripcion() }}</p>
    
    <!-- Price -->
    <p id="product-card__price">{{ formatPrice(getPrice()) }}</p>
    
    <!-- Action buttons -->
    <div *ngIf="!canEdit" class="action-buttons">
      <button 
        [id]="'btn-addcart-' + getProductId()"
        class="add-to-cart-button"
        (click)="onAddToCart($event)"
        [disabled]="getQuantity() <= 0"
        title="Agregar al carrito"
        aria-label="Agregar al carrito"
      >
        🛒 Agregar al carrito
      </button>
      <button 
        [id]="'btn-comprar-' + getProductId()"
        class="buy-button"
        (click)="onBuyNow($event)"
        [disabled]="getQuantity() <= 0"
        title="Comprar"
        aria-label="Comprar"
      >
        💳 Comprar
      </button>
    </div>
  </div>
</div>
